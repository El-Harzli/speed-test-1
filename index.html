<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSI Properties — Luxury Real Estate in Tangier</title>
    <meta
      name="description"
      content="Luxury real estate for sale and rent in Tangier, Morocco — curated listings, private concierge service, and local expertise from BSI Properties."

    <!-- Open Graph / Twitter Card defaults, shown for every page except
         /property/:id, which gets its own per-listing title/description/
         image injected server-side (see netlify/edge-functions/property-
         og-tags.js) — link-preview crawlers fetch raw HTML and don't run
         JS, so this file's static tags are all they ever see otherwise.
         TODO(production): swap REPLACE-WITH-PRODUCTION-DOMAIN.example for
         the real domain once it's live — see PRODUCTION_TODO.md. -->
    <meta property="og:site_name" content="BSI Properties" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BSI Properties — Luxury Real Estate in Tangier" />
    <meta
      property="og:description"
      content="Curated luxury listings, private concierge service, and local expertise in Tangier, Morocco."
    />
    <meta property="og:image" content="https://REPLACE-WITH-PRODUCTION-DOMAIN.example/og-image.jpg" />
    <meta property="og:url" content="https://REPLACE-WITH-PRODUCTION-DOMAIN.example/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
